[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "extendcodeagent"
version = "0.1.0"
description = "Host-neutral Project Intelligence core for coding agent runtimes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ExtendCodeAgent contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/extendcodeagent/storage/sqlite.py" = ["E501"] # SQL remains readable as complete statements.

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
